[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qavector"
# Single source of truth for the version. Read at runtime via importlib.metadata
# (--version); never hardcode a second copy. See CHANGELOG.md for the bump rules.
version = "0.16.7"
description = "Launch one isolated, auto-logged-in Chrome window per test user, then drive declarative flows over CDP."
readme = "README.md"
# 3.9 is the floor: ThreadPoolExecutor.shutdown(cancel_futures=...) is used for
# the CTRL+C path in engine/runner.py and was added in 3.9.
requires-python = ">=3.9"
keywords = ["chrome", "testing", "cdp", "playwright", "multi-user", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

# Upper bounds are deliberate: playwright in particular moves fast and the adapter
# talks to its API directly (adapters/playwright_adapter.py). A fork six months
# from now should fail loudly at install time rather than mysteriously at runtime.
dependencies = [
    "cryptography>=3.4,<50",
]

[project.optional-dependencies]
# Only needed for --run-tests; a plain launch never imports either of these.
flows = [
    "playwright>=1.40,<2",
    "pyyaml>=6.0,<7",
]
dev = [
    "qavector[flows]",
    "pytest>=7.0,<10",
]

[project.scripts]
qavector = "session_launcher:main"

[tool.setuptools]
py-modules = ["session_launcher"]

[tool.setuptools.packages.find]
include = ["engine*", "adapters*", "domain*", "cycle*"]

[tool.setuptools.package-data]
engine = ["hud.js", "recorder.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
